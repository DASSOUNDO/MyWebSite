# Configuration du proxy de l'assistant IA (Cloudflare Workers)
# Les clés API ne sont JAMAIS écrites ici : elles se déclarent en secrets
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GROQ_API_KEY

name = "portfolio-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites autorisés à appeler l'assistant (séparés par des virgules)
ALLOWED_ORIGINS = "https://dassoundo.github.io,http://localhost:8765"
# Base de connaissances générée par tools/build_knowledge.py et publiée avec le site
KNOWLEDGE_BASE_URL = "https://dassoundo.github.io/MyWebSite/assistant"
# Chaîne de modèles gratuits, essayés dans l'ordre (fournisseur:modèle|libellé affiché).
# Chacun a son propre quota : si l'un est saturé, la question passe au suivant.
# Modèles vérifiés le 22/10/2026 ; liste à jour : AI Studio (Gemini) et console.groq.com/docs/models
PROVIDERS = "gemini:gemini-3-flash-preview|Gemini 3 Flash,groq:openai/gpt-oss-120b|GPT-OSS 120B,groq:qwen/qwen3.8-27b|Qwen3"

# Limiteur de débit Cloudflare : 8 questions par minute et par visiteur
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
